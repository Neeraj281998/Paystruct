spring:
  application:
    name: paystruct-service
  datasource:
    # Defaults are for the local Docker Compose database only (see ../.env.example and ../docker-compose.yml).
    # Environment variables override them; point POSTGRES_* at anything else and set a real password there.
    # Spring Boot does not read .env, so these defaults are what make `./mvnw spring-boot:run` work after
    # `docker compose up -d`.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:paystruct}
    username: ${POSTGRES_USER:paystruct}
    password: ${POSTGRES_PASSWORD:paystruct}
  flyway:
    enabled: true

paystruct:
  ingest:
    # Hard cap on one request body. Larger bodies are rejected with HTTP 413.
    max-request-size: 5MB
    # Schema errors kept per message (the total count is always reported).
    max-schema-errors: 1000
    # Supported message versions. Adding a version = adding its XSD and one entry here.
    message-types:
      - namespace: urn:iso:std:iso:20022:tech:xsd:pacs.008.001.14
        type: pacs.008
        xsd: xsd/pacs.008.001.14.xsd
      - namespace: urn:iso:std:iso:20022:tech:xsd:pain.001.001.13
        type: pain.001
        xsd: xsd/pain.001.001.13.xsd
