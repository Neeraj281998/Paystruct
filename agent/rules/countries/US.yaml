# United States. Labelling guide section 17.
code: US
names: [United States, United States of America, USA, U.S.A., America]
postcode:
  patterns: ['\d{5}(?:-\d{4})?']
  max_tokens: 1
  unique: false
number_position: before
admin1_is_abbr: true
street:
  words_after: [street, st, avenue, ave, boulevard, blvd, drive, dr, lane, ln, road, rd, court, ct, way, place, pl, parkway, pkwy, circle, cir, trail, trl, highway, hwy, terrace]
  trailing: [east, west, north, south, e, w, n, s, ne, nw, se, sw]
  leading: [east, west, north, south, e, w, n, s, ne, nw, se, sw]
building_words: [building, tower, plaza, center, complex]
unit_patterns:
  - '(?:apt|apartment|suite|ste|unit)\.?\s*(?:no\.?\s*)?(?:\d+[A-Za-z]?|[A-Za-z]\d*)'
  - '#\s?\w+'
floor_patterns:
  - '\d+(?:st|nd|rd|th)\s*(?:floor|fl)\.?'
  - '(?:floor|fl)\.?\s*\d+'
pobox_patterns:
  - 'p\.?\s?o\.?\s?box\s*\d+'
