name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      # No GeoNames file in CI (it is not committed), no LLM calls, no secrets.
      - name: agent and evals tests
        run: python -m pytest agent/tests evals/tests -q
      - name: rules-only smoke run on a fixed sample of dev
        run: python -m evals.smoke
